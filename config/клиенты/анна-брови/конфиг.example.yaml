# ============================================================
# Пример конфига клиента — скопируйте как конфиг.yaml и заполните перед запуском.
# Меняете ТОЛЬКО этот файл. Код бота не трогаем.
# Все поля, которые здесь не указаны, берутся из конфига ниши
# config/ниши/бровист.yaml
# ============================================================

клиент: anna-brovi
ниша: бровист

# --- Техническое ---
токен_бота: "ВСТАВЬТЕ_ТОКЕН_ОТ_BotFather"   # получить у @BotFather в Telegram
админы: [0]                                   # замените на числовой Telegram-ID мастера

# --- Общее ---
название_студии: "Моя студия"
имя_мастера: "Имя мастера"
приветствие: |
  Привет! 👋 Я бот записи студии «Моя студия».
  Здесь можно записаться на удобное время, посмотреть прайс и контакты. 😊
описание: ""
адрес: ""
контакты:
  телефон: ""
  instagram: ""

# --- Услуги клиента (перекрывают базу ниши) ---
# можно править цены, длительность, включать/выключать услуги,
# добавлять свои. Формат строки обязателен.
услуги:
  - название: "Коррекция бровей"
    цена: 900
    длительность_мин: 30
    включена: true
  - название: "Окрашивание бровей"
    цена: 800
    длительность_мин: 20
    включена: true
  - название: "Комплекс: коррекция + окрашивание"
    цена: 1500
    длительность_мин: 50
    включена: true
  - название: "Ламинирование бровей"
    цена: 2000
    длительность_мин: 60
    включена: true

# --- Расписание клиента ---
запись:
  рабочие_дни: [вт, ср, чт, пт, сб]
  рабочие_часы: "10:00-19:00"

# --- Предоплата ---
# Заглушка: бот не принимает деньги и не отправляет реквизиты.
предоплата:
  включена: false
  режим: "заглушка"
  реквизиты: ""

# --- Отзывы клиента ---
отзывы: []
