# ============================================================
# КОНФИГ НИШИ «МАНИКЮР» — базовый шаблон (Тариф 1)
# Клиентские правки — только в config/клиенты/<клиент>/конфиг.yaml
# ============================================================

ниша: маникюр
название_студии: "Студия маникюра"
имя_мастера: "Мастер"
приветствие: |
  Привет! 💅 Запишись на маникюр.
описание: ""
адрес: ""
контакты:
  телефон: ""
  instagram: ""

услуги:
  - название: "Маникюр классический"
    цена: 1200
    длительность_мин: 60
    включена: true
  - название: "Маникюр + покрытие гель-лак"
    цена: 2000
    длительность_мин: 90
    включена: true
  - название: "Наращивание ногтей"
    цена: 2800
    длительность_мин: 120
    включена: false
  - название: "Педикюр"
    цена: 2200
    длительность_мин: 90
    включена: false

запись:
  рабочие_дни: [пн, вт, ср, чт, пт, сб]
  рабочие_часы: "09:00-21:00"
  шаг_слота_мин: 30
  режим_доступности: "админ_в_боте"
  календарь_источник: ""

предоплата:
  включена: false
  режим: "заглушка"
  реквизиты: ""
  политика_отмены: "При отмене менее чем за 24 часа предоплата не возвращается."
  возврат_за_часов: 24
  текст_для_клиента: |
    Для подтверждения записи нужна предоплата.

отзывы:
  - "Покрытие держится уже третью неделю!"
  - "Очень аккуратно и быстро. Рекомендую 💅"

модули:
  напоминания:
    включено: true
    за_24ч: true
    за_2ч: true
  отзывы:
    включено: true
  каталог_работ:
    включено: false
    фото: []
  админ_режим:
    включено: true
