# ============================================================
# КОНФИГ НИШИ «БРОВИСТ» — базовый шаблон (Тариф 1)
# Этот файл НЕ меняем под клиента. Клиентские правки — только
# в файле config/клиенты/<клиент>/конфиг.yaml (он перекрывает этот).
# ============================================================

# ===== ОБЩЕЕ =====
ниша: бровист
название_студии: "Студия бровей"
имя_мастера: "Мастер"
приветствие: |
  Привет! 👋 Запишись на брови.
описание: ""
адрес: ""
контакты:
  телефон: ""
  instagram: ""

# ===== УСЛУГИ (база ниши, клиент правит в своём конфиге) =====
услуги:
  - название: "Коррекция бровей"
    цена: 800
    длительность_мин: 30
    включена: true
  - название: "Окрашивание бровей"
    цена: 700
    длительность_мин: 20
    включена: true
  - название: "Комплекс: коррекция + окрашивание"
    цена: 1300
    длительность_мин: 50
    включена: true
  - название: "Долговременная укладка"
    цена: 1500
    длительность_мин: 60
    включена: false
  - название: "Ламинирование бровей"
    цена: 1800
    длительность_мин: 60
    включена: false

# ===== ЗАПИСЬ И ДОСТУПНОСТЬ =====
запись:
  рабочие_дни: [пн, вт, ср, чт, пт, сб]
  рабочие_часы: "10:00-20:00"
  шаг_слота_мин: 30
  режим_доступности: "админ_в_боте"   # админ_в_боте / мой_календарь
  календарь_источник: ""               # если режим = мой_календарь (ЗАГЛУШКА в коде)

# ===== ПРЕДОПЛАТА =====
предоплата:
  включена: false
  режим: "заглушка"  # приём предоплаты в базовом тарифе не реализован
  реквизиты: ""
  политика_отмены: "При отмене менее чем за 24 часа предоплата не возвращается."
  возврат_за_часов: 24
  текст_для_клиента: |
    Для подтверждения записи нужна предоплата.

# ===== ОТЗЫВЫ (статические, для меню) =====
отзывы:
  - "Очень довольна результатом! Обязательно вернусь. 😊"
  - "Уютная атмосфера и внимание к деталям."
  - "Записываюсь уже третий раз — всё всегда идеально."

# ===== МОДУЛИ-ФУНКЦИИ (галочки) =====
модули:
  напоминания:
    включено: true
    за_24ч: true
    за_2ч: true
  отзывы:
    включено: true
  каталог_работ:
    включено: false
    фото: []
  админ_режим:
    включено: true
